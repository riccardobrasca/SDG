name: Build Project

on:
  push:
    branches:
      - main
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'scripts/**'
      - '.github/workflows/build-project.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'scripts/**'
      - '.github/workflows/build-project.yml'
  workflow_dispatch: # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# This workflow only reads the repository: it builds, it does not publish.
permissions:
  contents: read

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      # Restore before anything writes to .lake/build. The key pins the
      # toolchain and the dependency set; the fallbacks reuse the most recent
      # build made with the same toolchain, never one from a different
      # toolchain.
      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: .lake/build
          key: LakeBuild-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            LakeBuild-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            LakeBuild-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

      # Our Mathlib is a branch of a fork, so its cache lives in the `forks`
      # container, which is namespaced per Mathlib commit. `lake exe cache get`
      # works out that namespace from `git rev-parse HEAD` in the working
      # directory -- here the SDG repository, not Mathlib -- so it looks in a
      # namespace that was never written, finds nothing, and the whole of
      # Mathlib gets recompiled (25 minutes, against 3 with the cache).
      # Setting the namespace explicitly from the pinned Mathlib revision is the
      # documented override. Keep this step before lean-action, which is what
      # runs `cache get`. See scripts/cache-get.sh for the local equivalent.
      - name: Read the Mathlib cache namespace from lake-manifest.json
        run: |
          rev=$(jq -er '.packages[] | select(.name == "mathlib") | .rev' lake-manifest.json)
          echo "Mathlib revision: $rev"
          echo "MATHLIB_CACHE_REPO_SCOPE=$rev" >> "$GITHUB_ENV"

      - name: Install and configure Lean, and get Mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      # A module that nothing imports is never compiled by `lake build SDG`, so
      # it could rot unnoticed. `lake exe mk_all --check` is the usual guard,
      # but it insists on regenerating SDG.lean without its copyright header,
      # so it can never pass here. Compare the import list directly instead.
      - name: Check that SDG.lean imports every module
        run: |
          find SDG -name '*.lean' | sed 's#/#.#g; s#\.lean$##' | sort > /tmp/sdg-modules.txt
          sed -nE 's/^[[:space:]]*(public[[:space:]]+)?import[[:space:]]+([A-Za-z0-9_.]+).*/\2/p' SDG.lean | sort > /tmp/sdg-imported.txt
          if ! diff -u /tmp/sdg-imported.txt /tmp/sdg-modules.txt; then
            echo "::error::SDG.lean does not import exactly the modules under SDG/. In the diff above, '-' is imported but missing from disk and '+' is present on disk but not imported. Edit SDG.lean by hand, keeping its copyright header."
            exit 1
          fi
          echo "SDG.lean imports all $(wc -l < /tmp/sdg-modules.txt) modules."

      - name: Build project
        run: ~/.elan/bin/lake build SDG

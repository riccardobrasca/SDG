name: Build Project

on:
  push:
    branches:
      - main
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
  workflow_dispatch: # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and modify PR labels
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      # Our mathlib is a branch of a fork, so its cache lives in the `forks`
      # container, which is namespaced per mathlib commit. `lake exe cache get`
      # takes that namespace from `git rev-parse HEAD` in the working directory
      # -- here the SDG repository, not mathlib -- and so looks in a namespace
      # that was never written, and the whole of mathlib gets recompiled.
      # Setting the namespace explicitly from the pinned mathlib revision is the
      # documented way to override it. Keep this step before lean-action, which
      # is what runs `cache get`. See scripts/cache-get.sh for the local
      # equivalent.
      - name: Read the mathlib cache namespace from lake-manifest.json
        run: |
          rev=$(jq -er '.packages[] | select(.name == "mathlib") | .rev' lake-manifest.json)
          echo "mathlib revision: $rev"
          echo "MATHLIB_CACHE_REPO_SCOPE=$rev" >> "$GITHUB_ENV"

      - name: Install and configure Lean, and get mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: "Check that SDG.lean is up to date"
        run: |
          ~/.elan/bin/lake exe mk_all --check || echo "ERROR: please ensure that SDG.lean is up to date, for instance by running lake exe mk_all"

      - name: Cache build artifacts
        uses: actions/cache@v5
        with:
          path: .lake/build
          key: LakeBuild-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
          restore-keys: LakeBuild-

      - name: Build project
        run: ~/.elan/bin/lake build SDG
